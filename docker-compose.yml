services:
  postgres:
    image: postgres:16-alpine
    container_name: taskpmp-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: taskpmp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./pg-init.sql:/docker-entrypoint-initdb.d/pg-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: taskpmp-redis
    ports:
      - "6379:6379"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskpmp-app
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      DATABASE_URL: "postgresql://postgres:password@postgres:5432/taskpmp?schema=public"
      JWT_SECRET: "taskpmp-super-secret-key-change-in-production"
      NEXT_PUBLIC_APP_ORIGIN: "http://localhost:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
