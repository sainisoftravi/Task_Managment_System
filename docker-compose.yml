services:
  postgres:
    image: postgres:16-alpine
    container_name: taskpmp-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: taskpmp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: taskpmp-redis
    ports:
      - "6379:6379"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskpmp-app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "file:./dev.db"
      JWT_SECRET: "taskpmp-super-secret-key-change-in-production"
      JWT_EXPIRES_IN: "7d"
      NEXT_PUBLIC_APP_ORIGIN: "http://localhost:3000"
      NEXT_PUBLIC_WS_URL: "ws://localhost:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
