name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Docker
        run: |
          docker --version
          docker compose version

      - name: Check current containers
        run: |
          docker compose ps

      - name: Build Docker images
        run: |
          docker compose build

      - name: Stop existing containers
        run: |
          docker compose down

      - name: Start containers
        run: |
          docker compose up -d

      - name: Wait for app to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "App is ready"
              break
            fi
            echo "Waiting for app... ($i/30)"
            sleep 5
          done

      - name: Push database schema
        run: |
          docker compose exec -T app npx prisma db push || echo "Schema push skipped"

      - name: Seed database
        run: |
          docker compose exec -T app npm run db:seed || echo "Seed skipped: already populated"

      - name: Restart app after seeding
        if: always()
        run: |
          docker compose restart app

      - name: Wait for app restart
        run: |
          sleep 10

      - name: Check deployment
        run: |
          docker compose ps

      - name: Verify application
        run: |
          docker compose exec -T app curl -f http://localhost:3000/api/health || curl -f http://localhost:3000/api/health
